<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Café Manager</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        * { font-family: 'Inter', sans-serif; }
        .sidebar-brown { background: linear-gradient(180deg, #6B4423 0%, #5D3A1A 100%); }
        .nav-active { background: #E67E22; }
        .bg-cream { background-color: #F5F0E8; }
        .bg-card { background-color: #FFFFFF; }
        .text-brown { color: #5D3A1A; }
        .text-brown-light { color: #8B6914; }
        .border-brown { border-color: #C4A77D; }
        .btn-primary { background: #6B4423; color: white; }
        .btn-primary:hover { background: #5D3A1A; }
        .btn-orange { background: #E67E22; color: white; }
        .btn-orange:hover { background: #D35400; }
        .input-cream { background: #F5F0E8; border: 1px solid #D4C5B0; }
        .input-cream:focus { border-color: #E67E22; outline: none; }
        .badge-green { background: #D4EDDA; color: #155724; }
        .badge-gray { background: #E2E3E5; color: #383D41; }
        .badge-category { background: #F5F0E8; color: #6B4423; border: 1px solid #D4C5B0; }
        .upload-area { background: #F5F0E8; border: 2px dashed #D4C5B0; }
        .upload-area:hover { border-color: #E67E22; }
        .table-row:hover { background: #FAF7F2; }
        .scroll::-webkit-scrollbar { width: 6px; }
        .scroll::-webkit-scrollbar-track { background: transparent; }
        .scroll::-webkit-scrollbar-thumb { background: #D4C5B0; border-radius: 3px; }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-cream h-screen overflow-hidden">
    <div class="flex h-full">
        <!-- Sidebar -->
        <aside class="sidebar-brown w-64 flex flex-col text-white flex-shrink-0">
            <div class="p-6 flex items-center gap-3 border-b border-white/10">
                <div class="w-10 h-10 bg-orange-500 rounded-lg flex items-center justify-center">
                    <i data-lucide="coffee" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">Café Manager</h1>
                    <p class="text-xs text-white/60">Admin</p>
                </div>
            </div>
            <nav class="flex-1 py-4 px-3 space-y-1 overflow-y-auto scroll">
                <button onclick="router('dashboard')" id="nav-dashboard" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm transition-colors hover:bg-white/10">
                    <i data-lucide="layout-grid" class="w-4 h-4"></i> Dashboard
                </button>
                <button onclick="router('products')" id="nav-products" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm transition-colors hover:bg-white/10">
                    <i data-lucide="package" class="w-4 h-4"></i> Products
                </button>
                <button onclick="router('orders')" id="nav-orders" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm transition-colors hover:bg-white/10">
                    <i data-lucide="shopping-cart" class="w-4 h-4"></i> Orders
                </button>
                <button onclick="router('inventory')" id="nav-inventory" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm transition-colors hover:bg-white/10">
                    <i data-lucide="box" class="w-4 h-4"></i> Inventory
                </button>
                <button onclick="router('employees')" id="nav-employees" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm transition-colors hover:bg-white/10">
                    <i data-lucide="users" class="w-4 h-4"></i> Employees
                </button>
                <button onclick="router('reports')" id="nav-reports" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm transition-colors hover:bg-white/10">
                    <i data-lucide="bar-chart-3" class="w-4 h-4"></i> Reports
                </button>
                <button onclick="router('settings')" id="nav-settings" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm transition-colors hover:bg-white/10">
                    <i data-lucide="settings" class="w-4 h-4"></i> Settings
                </button>
            </nav>
            <div class="p-3 border-t border-white/10">
                <button onclick="logout()" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm transition-colors hover:bg-white/10 text-white/80">
                    <i data-lucide="log-out" class="w-4 h-4"></i> Logout
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 overflow-hidden flex flex-col">
            <!-- Top Bar -->
            <header class="bg-white border-b border-stone-200 px-8 py-4 flex items-center justify-between flex-shrink-0">
                <div>
                    <h2 id="page-title" class="text-xl font-bold text-brown">Dashboard</h2>
                    <p id="page-subtitle" class="text-sm text-stone-500">Welcome back, Admin</p>
                </div>
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-full bg-orange-100 flex items-center justify-center">
                        <i data-lucide="user" class="w-5 h-5 text-orange-600"></i>
                    </div>
                </div>
            </header>

            <!-- Content Area -->
            <div id="content" class="flex-1 overflow-y-auto scroll p-8">
                <!-- Views will be injected here -->
            </div>
        </main>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 bg-brown text-white px-6 py-3 rounded-lg shadow-lg transform translate-y-20 opacity-0 transition-all duration-300 z-50 flex items-center gap-2">
        <i data-lucide="check-circle" class="w-4 h-4"></i>
        <span id="toast-msg">Success</span>
    </div>

    <script>
        let db;
        let currentView = 'dashboard';
        let editingProductId = null;
        let uploadedImage = null;

        // Initialize SQLite
        async function initDB() {
            const SQL = await initSqlJs({ locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}` });
            db = new SQL.Database();

            // Create tables
            db.run(`CREATE TABLE IF NOT EXISTS categories (id INTEGER PRIMARY KEY, name TEXT)`);
            db.run(`CREATE TABLE IF NOT EXISTS products (
                id INTEGER PRIMARY KEY AUTOINCREMENT,
                product_id TEXT UNIQUE,
                name TEXT NOT NULL,
                category TEXT,
                price REAL,
                description TEXT,
                image TEXT,
                status TEXT DEFAULT 'active',
                created_at TEXT DEFAULT CURRENT_TIMESTAMP
            )`);
            db.run(`CREATE TABLE IF NOT EXISTS orders (
                id INTEGER PRIMARY KEY AUTOINCREMENT,
                order_id TEXT UNIQUE,
                customer TEXT,
                total REAL,
                status TEXT,
                created_at TEXT DEFAULT CURRENT_TIMESTAMP
            )`);
            db.run(`CREATE TABLE IF NOT EXISTS inventory (
                id INTEGER PRIMARY KEY AUTOINCREMENT,
                product_id TEXT,
                quantity INTEGER,
                min_level INTEGER
            )`);
            db.run(`CREATE TABLE IF NOT EXISTS employees (
                id INTEGER PRIMARY KEY AUTOINCREMENT,
                name TEXT,
                role TEXT,
                email TEXT,
                phone TEXT,
                status TEXT DEFAULT 'active'
            )`);

            // Seed categories
            const cats = ['Coffee', 'Tea', 'Desserts', 'Cold Drinks'];
            cats.forEach(c => db.run(`INSERT OR IGNORE INTO categories (name) VALUES (?)`, [c]));

            // Seed products from screenshot
            const products = [
                ['PRD-001', 'Espresso', 'Coffee', 3.50, 'Rich and bold single shot espresso', null, 'active'],
                ['PRD-002', 'Cappuccino', 'Coffee', 4.25, 'A rich and creamy espresso-based coffee drink', null, 'active'],
                ['PRD-003', 'Latte', 'Coffee', 4.50, 'Smooth espresso with steamed milk', null, 'active'],
                ['PRD-004', 'Americano', 'Coffee', 3.75, 'Espresso diluted with hot water', null, 'active'],
                ['PRD-005', 'Green Tea', 'Tea', 2.50, 'Refreshing green tea', null, 'active'],
                ['PRD-006', 'Earl Grey', 'Tea', 2.75, 'Classic bergamot flavored black tea', null, 'active'],
                ['PRD-007', 'Chocolate Cake', 'Desserts', 5.50, 'Decadent chocolate layer cake', null, 'active'],
                ['PRD-008', 'Cheesecake', 'Desserts', 6.00, 'Creamy New York style cheesecake', null, 'active'],
                ['PRD-009', 'Iced Latte', 'Cold Drinks', 5.00, 'Chilled espresso with milk over ice', null, 'active'],
                ['PRD-010', 'Frappe', 'Cold Drinks', 5.50, 'Blended iced coffee drink', null, 'inactive'],
            ];
            products.forEach(p => {
                db.run(`INSERT OR IGNORE INTO products (product_id, name, category, price, description, image, status) VALUES (?,?,?,?,?,?,?)`, p);
            });

            // Seed orders
            const orders = [
                ['ORD-001', 'John Smith', 12.50, 'completed'],
                ['ORD-002', 'Sarah Johnson', 8.75, 'pending'],
                ['ORD-003', 'Mike Brown', 15.00, 'completed'],
                ['ORD-004', 'Emily Davis', 6.25, 'pending'],
                ['ORD-005', 'Chris Wilson', 22.00, 'completed'],
            ];
            orders.forEach(o => db.run(`INSERT OR IGNORE INTO orders (order_id, customer, total, status) VALUES (?,?,?,?)`, o));

            // Seed inventory
            const inventory = [
                ['PRD-001', 50, 10], ['PRD-002', 45, 10], ['PRD-003', 60, 15],
                ['PRD-004', 40, 10], ['PRD-005', 30, 8], ['PRD-006', 25, 5],
                ['PRD-007', 15, 5], ['PRD-008', 12, 3], ['PRD-009', 35, 10], ['PRD-010', 20, 5],
            ];
            inventory.forEach(i => db.run(`INSERT OR IGNORE INTO inventory (product_id, quantity, min_level) VALUES (?,?,?)`, i));

            // Seed employees
            const employees = [
                ['Alice Cooper', 'Manager', 'alice@cafe.com', '555-0101', 'active'],
                ['Bob Martinez', 'Barista', 'bob@cafe.com', '555-0102', 'active'],
                ['Carol White', 'Barista', 'carol@cafe.com', '555-0103', 'active'],
                ['David Lee', 'Cashier', 'david@cafe.com', '555-0104', 'inactive'],
            ];
            employees.forEach(e => db.run(`INSERT OR IGNORE INTO employees (name, role, email, phone, status) VALUES (?,?,?,?,?)`, e));
        }

        // Router
        function router(view, data = null) {
            currentView = view;
            editingProductId = data;
            uploadedImage = null;

            // Update sidebar
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('nav-active'));
            const activeNav = document.getElementById(`nav-${view.split('-')[0]}`);
            if (activeNav) activeNav.classList.add('nav-active');

            const content = document.getElementById('content');
            const title = document.getElementById('page-title');
            const subtitle = document.getElementById('page-subtitle');

            switch(view) {
                case 'dashboard':
                    title.textContent = 'Dashboard';
                    subtitle.textContent = 'Overview of your café';
                    renderDashboard(content);
                    break;
                case 'products':
                    title.textContent = 'Products Management';
                    subtitle.textContent = 'Manage your café menu items';
                    renderProducts(content);
                    break;
                case 'add-product':
                    title.textContent = 'Add New Product';
                    subtitle.textContent = 'Add a new item to your menu';
                    renderProductForm(content, false);
                    break;
                case 'edit-product':
                    title.textContent = 'Edit Product';
                    subtitle.textContent = 'Update product information';
                    renderProductForm(content, true);
                    break;
                case 'orders':
                    title.textContent = 'Orders';
                    subtitle.textContent = 'Manage customer orders';
                    renderOrders(content);
                    break;
                case 'inventory':
                    title.textContent = 'Inventory';
                    subtitle.textContent = 'Track stock levels';
                    renderInventory(content);
                    break;
                case 'employees':
                    title.textContent = 'Employees';
                    subtitle.textContent = 'Staff management';
                    renderEmployees(content);
                    break;
                case 'reports':
                    title.textContent = 'Reports';
                    subtitle.textContent = 'Sales and analytics';
                    renderReports(content);
                    break;
                case 'settings':
                    title.textContent = 'Settings';
                    subtitle.textContent = 'Application preferences';
                    renderSettings(content);
                    break;
            }
            lucide.createIcons();
        }

        // Dashboard
        function renderDashboard(container) {
            const stats = db.exec(`SELECT 
                (SELECT COUNT(*) FROM products) as total_products,
                (SELECT COUNT(*) FROM orders) as total_orders,
                (SELECT COUNT(*) FROM employees WHERE status='active') as total_employees,
                (SELECT SUM(total) FROM orders) as total_revenue
            `)[0]?.values[0] || [0,0,0,0];

            const recentOrders = db.exec(`SELECT * FROM orders ORDER BY id DESC LIMIT 5`)[0]?.values || [];

            container.innerHTML = `
                <div class="fade-in space-y-6">
                    <div class="grid grid-cols-4 gap-6">
                        <div class="bg-card rounded-xl p-6 shadow-sm border border-stone-100">
                            <div class="flex items-center justify-between">
                                <div>
                                    <p class="text-sm text-stone-500">Total Products</p>
                                    <p class="text-2xl font-bold text-brown mt-1">${stats[0]}</p>
                                </div>
                                <div class="w-12 h-12 bg-orange-100 rounded-lg flex items-center justify-center">
                                    <i data-lucide="package" class="w-6 h-6 text-orange-600"></i>
                                </div>
                            </div>
                        </div>
                        <div class="bg-card rounded-xl p-6 shadow-sm border border-stone-100">
                            <div class="flex items-center justify-between">
                                <div>
                                    <p class="text-sm text-stone-500">Total Orders</p>
                                    <p class="text-2xl font-bold text-brown mt-1">${stats[1]}</p>
                                </div>
                                <div class="w-12 h-12 bg-green-100 rounded-lg flex items-center justify-center">
                                    <i data-lucide="shopping-cart" class="w-6 h-6 text-green-600"></i>
                                </div>
                            </div>
                        </div>
                        <div class="bg-card rounded-xl p-6 shadow-sm border border-stone-100">
                            <div class="flex items-center justify-between">
                                <div>
                                    <p class="text-sm text-stone-500">Employees</p>
                                    <p class="text-2xl font-bold text-brown mt-1">${stats[2]}</p>
                                </div>
                                <div class="w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center">
                                    <i data-lucide="users" class="w-6 h-6 text-blue-600"></i>
                                </div>
                            </div>
                        </div>
                        <div class="bg-card rounded-xl p-6 shadow-sm border border-stone-100">
                            <div class="flex items-center justify-between">
                                <div>
                                    <p class="text-sm text-stone-500">Revenue</p>
                                    <p class="text-2xl font-bold text-brown mt-1">$${(stats[3] || 0).toFixed(2)}</p>
                                </div>
                                <div class="w-12 h-12 bg-purple-100 rounded-lg flex items-center justify-center">
                                    <i data-lucide="dollar-sign" class="w-6 h-6 text-purple-600"></i>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-6">
                        <div class="bg-card rounded-xl p-6 shadow-sm border border-stone-100">
                            <h3 class="font-bold text-brown mb-4">Recent Orders</h3>
                            <div class="space-y-3">
                                ${recentOrders.map(o => `
                                    <div class="flex items-center justify-between py-2 border-b border-stone-100 last:border-0">
                                        <div>
                                            <p class="font-medium text-sm">${o[1]}</p>
                                            <p class="text-xs text-stone-400">${o[4]}</p>
                                        </div>
                                        <div class="text-right">
                                            <p class="font-bold text-sm">$${o[3].toFixed(2)}</p>
                                            <span class="text-xs px-2 py-0.5 rounded-full ${o[4] === 'completed' ? 'badge-green' : 'badge-gray'}">${o[4]}</span>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                        <div class="bg-card rounded-xl p-6 shadow-sm border border-stone-100">
                            <h3 class="font-bold text-brown mb-4">Low Stock Alert</h3>
                            <div class="space-y-3">
                                ${getLowStock().map(i => `
                                    <div class="flex items-center justify-between py-2 border-b border-stone-100 last:border-0">
                                        <div class="flex items-center gap-3">
                                            <div class="w-8 h-8 bg-red-100 rounded-lg flex items-center justify-center">
                                                <i data-lucide="alert-triangle" class="w-4 h-4 text-red-600"></i>
                                            </div>
                                            <div>
                                                <p class="font-medium text-sm">${i.name}</p>
                                                <p class="text-xs text-stone-400">Min: ${i.min}</p>
                                            </div>
                                        </div>
                                        <p class="font-bold text-red-600 text-sm">${i.qty} left</p>
                                    </div>
                                `).join('') || '<p class="text-sm text-stone-400">No low stock items</p>'}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function getLowStock() {
            const res = db.exec(`SELECT p.name, i.quantity, i.min_level 
                FROM inventory i JOIN products p ON i.product_id = p.product_id 
                WHERE i.quantity <= i.min_level`);
            return (res[0]?.values || []).map(r => ({ name: r[0], qty: r[1], min: r[2] }));
        }

        // Products
        function renderProducts(container) {
            const search = document.getElementById('prod-search')?.value || '';
            const catFilter = document.getElementById('prod-category')?.value || '';

            let sql = `SELECT * FROM products WHERE 1=1`;
            const params = [];
            if (search) { sql += ` AND (name LIKE ? OR product_id LIKE ?)`; params.push(`%${search}%`, `%${search}%`); }
            if (catFilter) { sql += ` AND category = ?`; params.push(catFilter); }
            sql += ` ORDER BY id`;

            const result = db.exec(sql, params);
            const products = result[0]?.values || [];
            const categories = db.exec(`SELECT name FROM categories`)[0]?.values.map(c => c[0]) || [];

            container.innerHTML = `
                <div class="fade-in space-y-6">
                    <div class="flex items-center justify-between">
                        <div class="flex gap-3 flex-1 max-w-2xl">
                            <div class="relative flex-1">
                                <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-stone-400"></i>
                                <input type="text" id="prod-search" placeholder="Search products..." value="${search}" 
                                    oninput="renderProducts(document.getElementById('content'))"
                                    class="w-full pl-10 pr-4 py-2.5 rounded-lg input-cream text-sm">
                            </div>
                            <select id="prod-category" onchange="renderProducts(document.getElementById('content'))" 
                                class="px-4 py-2.5 rounded-lg input-cream text-sm min-w-[140px]">
                                <option value="">All Categories</option>
                                ${categories.map(c => `<option value="${c}" ${catFilter === c ? 'selected' : ''}>${c}</option>`).join('')}
                            </select>
                        </div>
                        <button onclick="router('add-product')" class="btn-orange px-4 py-2.5 rounded-lg text-sm font-medium flex items-center gap-2">
                            <i data-lucide="plus" class="w-4 h-4"></i> Add Product
                        </button>
                    </div>

                    <div class="bg-card rounded-xl shadow-sm border border-stone-100 overflow-hidden">
                        <div class="px-6 py-4 border-b border-stone-100">
                            <h3 class="font-semibold text-brown">All Products</h3>
                        </div>
                        <table class="w-full">
                            <thead>
                                <tr class="text-left text-xs font-medium text-stone-500 uppercase tracking-wider">
                                    <th class="px-6 py-3">Product ID</th>
                                    <th class="px-6 py-3">Product Name</th>
                                    <th class="px-6 py-3">Category</th>
                                    <th class="px-6 py-3">Price</th>
                                    <th class="px-6 py-3">Status</th>
                                    <th class="px-6 py-3 text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-stone-100">
                                ${products.map(p => `
                                    <tr class="table-row transition-colors">
                                        <td class="px-6 py-4 text-sm font-medium text-stone-600">${p[1]}</td>
                                        <td class="px-6 py-4 text-sm font-medium text-brown">${p[2]}</td>
                                        <td class="px-6 py-4"><span class="badge-category px-2.5 py-1 rounded-full text-xs font-medium">${p[3]}</span></td>
                                        <td class="px-6 py-4 text-sm font-medium">$${p[4].toFixed(2)}</td>
                                        <td class="px-6 py-4"><span class="${p[7] === 'active' ? 'badge-green' : 'badge-gray'} px-2.5 py-1 rounded-full text-xs font-medium">${p[7]}</span></td>
                                        <td class="px-6 py-4 text-right">
                                            <button onclick="router('edit-product', ${p[0]})" class="text-stone-400 hover:text-orange-600 transition-colors mr-3">
                                                <i data-lucide="pencil" class="w-4 h-4"></i>
                                            </button>
                                            <button onclick="deleteProduct(${p[0]})" class="text-stone-400 hover:text-red-600 transition-colors">
                                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                                            </button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                        ${products.length === 0 ? '<div class="text-center py-12 text-stone-400 text-sm">No products found</div>' : ''}
                    </div>
                </div>
            `;
        }

        // Product Form (Add/Edit)
        function renderProductForm(container, isEdit) {
            let product = { product_id: '', name: '', category: '', price: '', description: '', image: '', status: 'active' };
            if (isEdit && editingProductId) {
                const res = db.exec(`SELECT * FROM products WHERE id = ?`, [editingProductId]);
                if (res[0]?.values[0]) {
                    const p = res[0].values[0];
                    product = { product_id: p[1], name: p[2], category: p[3], price: p[4], description: p[5] || '', image: p[6] || '', status: p[7] };
                }
            }

            const categories = db.exec(`SELECT name FROM categories`)[0]?.values.map(c => c[0]) || [];
            const nextId = isEdit ? product.product_id : getNextProductId();

            container.innerHTML = `
                <div class="fade-in max-w-3xl">
                    <button onclick="router('products')" class="flex items-center gap-2 text-sm text-stone-500 hover:text-brown mb-4 transition-colors">
                        <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Products
                    </button>
                    <div class="bg-card rounded-xl shadow-sm border border-stone-100 p-8">
                        <h3 class="font-semibold text-brown mb-6">Product Information</h3>
                        <form onsubmit="event.preventDefault(); saveProduct(${isEdit}, '${nextId}');" class="space-y-5">
                            <div>
                                <label class="block text-sm font-medium text-brown mb-1.5">Product Name <span class="text-red-500">*</span></label>
                                <input type="text" id="p-name" value="${product.name}" placeholder="e.g., Cappuccino" 
                                    class="w-full px-4 py-2.5 rounded-lg input-cream text-sm" required>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-brown mb-1.5">Category <span class="text-red-500">*</span></label>
                                <select id="p-category" class="w-full px-4 py-2.5 rounded-lg input-cream text-sm" required>
                                    <option value="">Select category</option>
                                    ${categories.map(c => `<option value="${c}" ${product.category === c ? 'selected' : ''}>${c}</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-brown mb-1.5">Price ($) <span class="text-red-500">*</span></label>
                                <input type="number" id="p-price" value="${product.price}" placeholder="0.00" step="0.01" min="0"
                                    class="w-full px-4 py-2.5 rounded-lg input-cream text-sm" required>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-brown mb-1.5">Description</label>
                                <textarea id="p-desc" rows="3" placeholder="Enter product description..." 
                                    class="w-full px-4 py-2.5 rounded-lg input-cream text-sm resize-none">${product.description}</textarea>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-brown mb-1.5">Status</label>
                                <select id="p-status" class="w-full px-4 py-2.5 rounded-lg input-cream text-sm">
                                    <option value="active" ${product.status === 'active' ? 'selected' : ''}>Active</option>
                                    <option value="inactive" ${product.status === 'inactive' ? 'selected' : ''}>Inactive</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-brown mb-1.5">Product Image</label>
                                <div class="upload-area rounded-xl p-8 text-center cursor-pointer transition-colors" 
                                    onclick="document.getElementById('p-image').click()" id="drop-zone">
                                    <input type="file" id="p-image" accept="image/*" class="hidden" onchange="handleImageUpload(this)">
                                    <div id="upload-preview">
                                        <i data-lucide="upload-cloud" class="w-10 h-10 text-stone-400 mx-auto mb-3"></i>
                                        <p class="text-sm text-stone-500">Click to upload or drag and drop</p>
                                        <p class="text-xs text-stone-400 mt-1">PNG, JPG, GIF up to 10MB</p>
                                        <button type="button" class="mt-3 px-4 py-1.5 border border-stone-300 rounded-lg text-xs font-medium text-stone-600 hover:border-orange-400 hover:text-orange-600 transition-colors bg-white">Choose File</button>
                                    </div>
                                </div>
                            </div>
                            <div class="flex gap-3 pt-2">
                                <button type="submit" class="btn-primary px-6 py-2.5 rounded-lg text-sm font-medium">
                                    ${isEdit ? 'Update Product' : 'Add Product'}
                                </button>
                                <button type="button" onclick="router('products')" class="px-6 py-2.5 rounded-lg text-sm font-medium border border-stone-300 text-stone-600 hover:bg-stone-50 transition-colors">
                                    Cancel
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            `;

            // Drag and drop
            setTimeout(() => {
                const zone = document.getElementById('drop-zone');
                if (zone) {
                    zone.addEventListener('dragover', e => { e.preventDefault(); zone.style.borderColor = '#E67E22'; });
                    zone.addEventListener('dragleave', () => { zone.style.borderColor = '#D4C5B0'; });
                    zone.addEventListener('drop', e => {
                        e.preventDefault();
                        zone.style.borderColor = '#D4C5B0';
                        if (e.dataTransfer.files[0]) handleImageUpload({ files: e.dataTransfer.files });
                    });
                }
                // Show existing image if editing
                if (isEdit && product.image) {
                    uploadedImage = product.image;
                    showImagePreview(product.image);
                }
            }, 0);
        }

        function getNextProductId() {
            const res = db.exec(`SELECT product_id FROM products ORDER BY id DESC LIMIT 1`);
            if (!res[0]?.values[0]) return 'PRD-001';
            const last = res[0].values[0][0];
            const num = parseInt(last.split('-')[1]) + 1;
            return `PRD-${num.toString().padStart(3, '0')}`;
        }

        function handleImageUpload(input) {
            const file = input.files?.[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                uploadedImage = e.target.result;
                showImagePreview(uploadedImage);
            };
            reader.readAsDataURL(file);
        }

        function showImagePreview(src) {
            const preview = document.getElementById('upload-preview');
            if (preview) {
                preview.innerHTML = `<img src="${src}" class="max-h-32 mx-auto rounded-lg shadow-sm">`;
            }
        }

        function saveProduct(isEdit, productId) {
            const name = document.getElementById('p-name').value;
            const category = document.getElementById('p-category').value;
            const price = parseFloat(document.getElementById('p-price').value);
            const desc = document.getElementById('p-desc').value;
            const status = document.getElementById('p-status').value;
            const image = uploadedImage || '';

            if (isEdit && editingProductId) {
                db.run(`UPDATE products SET name=?, category=?, price=?, description=?, image=?, status=? WHERE id=?`,
                    [name, category, price, desc, image, status, editingProductId]);
                showToast('Product updated successfully');
            } else {
                db.run(`INSERT INTO products (product_id, name, category, price, description, image, status) VALUES (?,?,?,?,?,?,?)`,
                    [productId, name, category, price, desc, image, status]);
                // Add to inventory
                db.run(`INSERT INTO inventory (product_id, quantity, min_level) VALUES (?, 0, 10)`, [productId]);
                showToast('Product added successfully');
            }
            router('products');
        }

        function deleteProduct(id) {
            if (!confirm('Are you sure you want to delete this product?')) return;
            const pid = db.exec(`SELECT product_id FROM products WHERE id = ?`, [id])[0]?.values[0]?.[0];
            db.run(`DELETE FROM products WHERE id = ?`, [id]);
            if (pid) db.run(`DELETE FROM inventory WHERE product_id = ?`, [pid]);
            showToast('Product deleted');
            renderProducts(document.getElementById('content'));
        }

        // Orders
        function renderOrders(container) {
            const result = db.exec(`SELECT * FROM orders ORDER BY id DESC`);
            const orders = result[0]?.values || [];

            container.innerHTML = `
                <div class="fade-in space-y-6">
                    <div class="bg-card rounded-xl shadow-sm border border-stone-100 overflow-hidden">
                        <div class="px-6 py-4 border-b border-stone-100 flex items-center justify-between">
                            <h3 class="font-semibold text-brown">All Orders</h3>
                        </div>
                        <table class="w-full">
                            <thead>
                                <tr class="text-left text-xs font-medium text-stone-500 uppercase tracking-wider">
                                    <th class="px-6 py-3">Order ID</th>
                                    <th class="px-6 py-3">Customer</th>
                                    <th class="px-6 py-3">Total</th>
                                    <th class="px-6 py-3">Status</th>
                                    <th class="px-6 py-3">Date</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-stone-100">
                                ${orders.map(o => `
                                    <tr class="table-row transition-colors">
                                        <td class="px-6 py-4 text-sm font-medium text-stone-600">${o[1]}</td>
                                        <td class="px-6 py-4 text-sm font-medium text-brown">${o[2]}</td>
                                        <td class="px-6 py-4 text-sm font-medium">$${o[3].toFixed(2)}</td>
                                        <td class="px-6 py-4"><span class="${o[4] === 'completed' ? 'badge-green' : 'badge-gray'} px-2.5 py-1 rounded-full text-xs font-medium">${o[4]}</span></td>
                                        <td class="px-6 py-4 text-sm text-stone-500">${o[5]}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        // Inventory
        function renderInventory(container) {
            const result = db.exec(`SELECT p.name, p.product_id, i.quantity, i.min_level 
                FROM inventory i JOIN products p ON i.product_id = p.product_id ORDER BY p.name`);
            const items = result[0]?.values || [];

            container.innerHTML = `
                <div class="fade-in space-y-6">
                    <div class="bg-card rounded-xl shadow-sm border border-stone-100 overflow-hidden">
                        <div class="px-6 py-4 border-b border-stone-100">
                            <h3 class="font-semibold text-brown">Stock Levels</h3>
                        </div>
                        <table class="w-full">
                            <thead>
                                <tr class="text-left text-xs font-medium text-stone-500 uppercase tracking-wider">
                                    <th class="px-6 py-3">Product</th>
                                    <th class="px-6 py-3">Current Stock</th>
                                    <th class="px-6 py-3">Min Level</th>
                                    <th class="px-6 py-3">Status</th>
                                    <th class="px-6 py-3 text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-stone-100">
                                ${items.map(i => {
                                    const low = i[2] <= i[3];
                                    return `
                                    <tr class="table-row transition-colors">
                                        <td class="px-6 py-4 text-sm font-medium text-brown">${i[0]}</td>
                                        <td class="px-6 py-4 text-sm">${i[2]}</td>
                                        <td class="px-6 py-4 text-sm">${i[3]}</td>
                                        <td class="px-6 py-4"><span class="${low ? 'bg-red-100 text-red-700' : 'badge-green'} px-2.5 py-1 rounded-full text-xs font-medium">${low ? 'Low Stock' : 'OK'}</span></td>
                                        <td class="px-6 py-4 text-right">
                                            <button onclick="adjustStock('${i[1]}', 10)" class="text-sm text-orange-600 hover:text-orange-700 font-medium">+10</button>
                                            <button onclick="adjustStock('${i[1]}', -10)" class="text-sm text-stone-400 hover:text-red-600 font-medium ml-3">-10</button>
                                        </td>
                                    </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function adjustStock(productId, amount) {
            db.run(`UPDATE inventory SET quantity = MAX(0, quantity + ?) WHERE product_id = ?`, [amount, productId]);
            showToast(`Stock ${amount > 0 ? 'increased' : 'decreased'} by ${Math.abs(amount)}`);
            renderInventory(document.getElementById('content'));
        }

        // Employees
        function renderEmployees(container) {
            const result = db.exec(`SELECT * FROM employees ORDER BY id`);
            const employees = result[0]?.values || [];

            container.innerHTML = `
                <div class="fade-in space-y-6">
                    <div class="bg-card rounded-xl shadow-sm border border-stone-100 overflow-hidden">
                        <div class="px-6 py-4 border-b border-stone-100">
                            <h3 class="font-semibold text-brown">Staff Members</h3>
                        </div>
                        <table class="w-full">
                            <thead>
                                <tr class="text-left text-xs font-medium text-stone-500 uppercase tracking-wider">
                                    <th class="px-6 py-3">Name</th>
                                    <th class="px-6 py-3">Role</th>
                                    <th class="px-6 py-3">Email</th>
                                    <th class="px-6 py-3">Phone</th>
                                    <th class="px-6 py-3">Status</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-stone-100">
                                ${employees.map(e => `
                                    <tr class="table-row transition-colors">
                                        <td class="px-6 py-4 text-sm font-medium text-brown">${e[1]}</td>
                                        <td class="px-6 py-4 text-sm">${e[2]}</td>
                                        <td class="px-6 py-4 text-sm text-stone-500">${e[3]}</td>
                                        <td class="px-6 py-4 text-sm text-stone-500">${e[4]}</td>
                                        <td class="px-6 py-4"><span class="${e[5] === 'active' ? 'badge-green' : 'badge-gray'} px-2.5 py-1 rounded-full text-xs font-medium">${e[5]}</span></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        // Reports
        function renderReports(container) {
            const salesByCat = db.exec(`SELECT category, COUNT(*) as cnt, SUM(price) as total FROM products GROUP BY category`)[0]?.values || [];
            const totalProducts = db.exec(`SELECT COUNT(*) FROM products`)[0]?.values[0][0];
            const totalRevenue = db.exec(`SELECT SUM(total) FROM orders`)[0]?.values[0][0] || 0;

            container.innerHTML = `
                <div class="fade-in space-y-6">
                    <div class="grid grid-cols-3 gap-6">
                        <div class="bg-card rounded-xl p-6 shadow-sm border border-stone-100">
                            <p class="text-sm text-stone-500">Total Revenue</p>
                            <p class="text-3xl font-bold text-brown mt-2">$${totalRevenue.toFixed(2)}</p>
                        </div>
                        <div class="bg-card rounded-xl p-6 shadow-sm border border-stone-100">
                            <p class="text-sm text-stone-500">Total Products</p>
                            <p class="text-3xl font-bold text-brown mt-2">${totalProducts}</p>
                        </div>
                        <div class="bg-card rounded-xl p-6 shadow-sm border border-stone-100">
                            <p class="text-sm text-stone-500">Avg Order Value</p>
                            <p class="text-3xl font-bold text-brown mt-2">$${(totalRevenue / 5).toFixed(2)}</p>
                        </div>
                    </div>
                    <div class="bg-card rounded-xl p-6 shadow-sm border border-stone-100">
                        <h3 class="font-semibold text-brown mb-4">Sales by Category</h3>
                        <div class="space-y-4">
                            ${salesByCat.map(s => {
                                const pct = (s[1] / totalProducts * 100).toFixed(0);
                                return `
                                <div>
                                    <div class="flex justify-between text-sm mb-1">
                                        <span class="font-medium text-brown">${s[0]}</span>
                                        <span class="text-stone-500">$${s[2].toFixed(2)} (${pct}%)</span>
                                    </div>
                                    <div class="w-full bg-stone-100 rounded-full h-2.5">
                                        <div class="bg-orange-500 h-2.5 rounded-full transition-all" style="width: ${pct}%"></div>
                                    </div>
                                </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        // Settings
        function renderSettings(container) {
            container.innerHTML = `
                <div class="fade-in max-w-2xl">
                    <div class="bg-card rounded-xl shadow-sm border border-stone-100 p-8 space-y-6">
                        <div>
                            <h3 class="font-semibold text-brown mb-4">General Settings</h3>
                            <div class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium text-brown mb-1.5">Café Name</label>
                                    <input type="text" value="My Café" class="w-full px-4 py-2.5 rounded-lg input-cream text-sm">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-brown mb-1.5">Currency</label>
                                    <select class="w-full px-4 py-2.5 rounded-lg input-cream text-sm">
                                        <option>USD ($)</option>
                                        <option>EUR (€)</option>
                                        <option>GBP (£)</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="border-t border-stone-100 pt-6">
                            <h3 class="font-semibold text-brown mb-4">Notifications</h3>
                            <div class="space-y-3">
                                <label class="flex items-center gap-3 cursor-pointer">
                                    <input type="checkbox" checked class="w-4 h-4 accent-orange-500 rounded">
                                    <span class="text-sm text-stone-600">Low stock alerts</span>
                                </label>
                                <label class="flex items-center gap-3 cursor-pointer">
                                    <input type="checkbox" checked class="w-4 h-4 accent-orange-500 rounded">
                                    <span class="text-sm text-stone-600">New order notifications</span>
                                </label>
                            </div>
                        </div>
                        <div class="pt-4">
                            <button onclick="showToast('Settings saved')" class="btn-primary px-6 py-2.5 rounded-lg text-sm font-medium">Save Changes</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').textContent = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 2500);
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                showToast('Logged out successfully');
                setTimeout(() => router('dashboard'), 500);
            }
        }

        // Initialize
        initDB().then(() => {
            router('dashboard');
        });
    </script>
</body>
</html>
